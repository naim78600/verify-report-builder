name: GUI check (screens)

on:
  workflow_dispatch:
  push:
    branches-ignore: [main]

permissions:
  contents: write

jobs:
  screens:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements-dev.txt
      - name: Tests
        run: python -m pytest -q tests
      - name: Window smoke test + a picture of every screen
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb python3-tk imagemagick fonts-noto-core fonts-beng
          VRB_SHOTS=shots xvfb-run -a -s "-screen 0 1280x800x24" python tests/gui_smoke.py
      - name: Pictures to the ci-screens branch (for review; not part of the program)
        if: always()
        run: |
          [ -d shots ] || exit 0
          cd shots
          git init -q -b ci-screens
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add . && git commit -q -m "screens of ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-screens
