name: Make voice clips

# Run by hand only (Actions -> Make voice clips -> Run workflow, on a branch).  The clips already live in the program,
# so a merge or a release tag never needs this - and a busy voice service can no longer send a "failed" e-mail.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  voices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install (edge-tts voice, ffmpeg)
        run: |
          pip install edge-tts
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Make the clips
        run: python tools/voices/make_voices.py voices_out || (sleep 20 && python tools/voices/make_voices.py voices_out)
      - name: WhatsApp-friendly audio (.ogg Opus, mono)
        run: |
          mkdir -p voices
          for f in voices_out/*.mp3; do
            n=$(basename "$f" .mp3)
            ffmpeg -loglevel error -y -i "$f" -af "loudnorm,apad=pad_dur=0.3" -ac 1 -ar 48000 -c:a libopus -b:a 32k "voices/$n.ogg"
          done
          ls -la voices
      - name: Put the clips into the program (commit to this branch)
        run: |
          mkdir -p src/report_builder/assets/voices
          cp voices/*.ogg src/report_builder/assets/voices/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/report_builder/assets/voices
          git diff --cached --quiet || (git commit -m "Voice clips (made by the voices workflow)" && git push)
