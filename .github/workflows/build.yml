name: Build desktop app

on:
  workflow_dispatch:          # manual: GitHub > Actions > Build desktop app > Run workflow
  push:
    tags: ["v*"]              # tag like v1.0.0 -> also creates a Release with the files

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements-dev.txt && (pip install "uharfbuzz>=0.37" || echo "uharfbuzz not available - Bangla in the PDF stays unshaped")
      - run: python -m pytest -q tests

  release:                       # tag only: create the Release (title + text) first; each build attaches its own files to it
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4              # RELEASE_NOTES.md = the Release text
      - name: Release title (Version N (vX.Y.Z))
        id: title
        run: |
          v="${GITHUB_REF_NAME#v}"
          echo "name=Verify Report Builder Version ${v%%.*} (${GITHUB_REF_NAME})" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.title.outputs.name }}
          body_path: RELEASE_NOTES.md

  build:
    needs: [test, release]
    if: ${{ !cancelled() && needs.test.result == 'success' && (needs.release.result == 'success' || needs.release.result == 'skipped') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows-64bit
            arch: x64
          - os: windows-latest
            label: Windows-32bit
            arch: x86
          - os: macos-latest          # Apple Silicon (M1/M2/M3/M4)
            label: Mac-AppleSilicon
            arch: arm64
          - os: macos-15-intel        # Intel Mac (built to run on macOS 13 Ventura and newer)
            label: Mac-Intel
            arch: x64
    runs-on: ${{ matrix.os }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "13.0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: ${{ matrix.arch == 'x86' && 'x86' || (matrix.arch == 'x64' && 'x64' || 'arm64') }}
      - name: Install
        run: pip install -r requirements-dev.txt && (pip install "uharfbuzz>=0.37" || echo "uharfbuzz not available - Bangla in the PDF stays unshaped")
      - name: Check tkinter
        run: python -c "import tkinter; print('tk', tkinter.TkVersion)"

      - name: Build (Windows .exe)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name VerifyReportBuilder --paths src --collect-data reportlab --collect-all edge_tts --collect-data certifi `
            --add-data "src\report_builder\assets;report_builder\assets" run_app.py
          Compress-Archive -Path dist\VerifyReportBuilder.exe -DestinationPath "VerifyReportBuilder-${{ matrix.label }}.zip"

      - name: Windows installer (Setup.exe)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $v = (Select-String -Path src\report_builder\__init__.py -Pattern '__version__ = "(.+)"').Matches[0].Groups[1].Value
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=$v" "/DArch=${{ matrix.arch }}" installer\VerifyReportBuilder.iss
          Move-Item "installer_out\VerifyReportBuilder-Setup-${{ matrix.arch }}.exe" "VerifyReportBuilder-Setup-${{ matrix.label }}.exe"

      - name: Mac photo reader (Vision OCR) - build and self-test
        if: runner.os == 'macOS'
        run: |
          mkdir -p src/report_builder/assets/bin
          swiftc -O tools/mac_ocr/mac_ocr.swift -o src/report_builder/assets/bin/mac_ocr
          python - <<'PY'
          from PIL import Image, ImageDraw, ImageFont
          im = Image.new("RGB", (900, 260), "white"); d = ImageDraw.Draw(im)
          f = ImageFont.truetype("/System/Library/Fonts/Helvetica.ttc", 52)
          d.text((30, 30), "PL-20261001094920785", fill="black", font=f)
          d.text((30, 130), "Rahim Uddin  Sonali Bank", fill="black", font=f)
          im.save("ocr_test.png")
          PY
          out=$(src/report_builder/assets/bin/mac_ocr ocr_test.png); echo "$out"
          echo "$out" | grep -q "20261001094920785" && echo "$out" | grep -qi "sonali"
          PYTHONPATH=src python -c "from report_builder import bs_tracker as B; t=B.ocr_image('ocr_test.png'); assert '20261001094920785' in t, t; print('program reads the photo: OK')"

      - name: Mac list reader self-test (photo of the bank's list, v16)
        if: runner.os == 'macOS'
        continue-on-error: true
        run: |
          python - <<'PY'
          from PIL import Image, ImageDraw, ImageFont
          im = Image.new("RGB", (1400, 420), "white"); d = ImageDraw.Draw(im)
          f = ImageFont.truetype("/System/Library/Fonts/Helvetica.ttc", 34)
          for i, (n, name) in enumerate([("523659", "Bijoy Talukder, NICU Incharge,"), ("348425", "Md Obaidur Rahman, Branch")]):
              y = 60 + i * 170
              d.text((30, y), "TAT 7+", fill="black", font=f); d.text((230, y), n, fill="black", font=f)
              d.text((480, y - 30), name, fill="black", font=f); d.text((480, y + 20), "Dhaka- 01760878559", fill="black", font=f)
              d.text((1100, y), "11-Oct-2026", fill="black", font=f)
          im.save("list_test.png")
          PY
          PYTHONPATH=src python -c "from report_builder.list_reader import read_rows, rows_to_text; r,p=read_rows(['list_test.png']); t=rows_to_text(r); print(t, p); assert '523659 | Bijoy Talukder' in t and '348425 | Md Obaidur Rahman' in t"

      - name: Windows photo reader self-test (Windows' own OCR)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: |
          $env:PYTHONPATH = "src"
          python -c "from PIL import Image, ImageDraw, ImageFont; im=Image.new('RGB',(900,260),'white'); d=ImageDraw.Draw(im); f=ImageFont.truetype('arial.ttf',52); d.text((30,30),'PL-20261001094920785',fill='black',font=f); d.text((30,130),'Rahim Uddin  Sonali Bank',fill='black',font=f); im.save('ocr_test.png')"
          python -c "from report_builder import bs_tracker as B; t=B.ocr_image('ocr_test.png'); print(t); assert '20261001094920785' in t.replace(' ','')"
          python -c "from PIL import Image, ImageDraw, ImageFont; im=Image.new('RGB',(1400,420),'white'); d=ImageDraw.Draw(im); f=ImageFont.truetype('arial.ttf',34); rows=[('523659','Bijoy Talukder, NICU Incharge,'),('348425','Md Obaidur Rahman, Branch')]; [ (d.text((30,60+i*170),'TAT 7+',fill='black',font=f), d.text((230,60+i*170),n,fill='black',font=f), d.text((480,30+i*170),nm,fill='black',font=f), d.text((480,80+i*170),'Dhaka- 01760878559',fill='black',font=f), d.text((1100,60+i*170),'11-Oct-2026',fill='black',font=f)) for i,(n,nm) in enumerate(rows)]; im.save('list_test.png')"
          python -c "from report_builder.list_reader import read_rows, rows_to_text; r,p=read_rows(['list_test.png']); t=rows_to_text(r); print(t, p); assert '523659 | Bijoy Talukder' in t and '348425 | Md Obaidur Rahman' in t"

      - name: Build (Mac .app)
        if: runner.os == 'macOS'
        run: |
          pyinstaller --noconfirm --clean --windowed --name VerifyReportBuilder --paths src --collect-data reportlab --collect-all edge_tts --collect-data certifi \
            --add-data "src/report_builder/assets:report_builder/assets" \
            --osx-bundle-identifier com.example.verifyreportbuilder run_app.py
          ditto -c -k --sequesterRsrc --keepParent dist/VerifyReportBuilder.app "VerifyReportBuilder-${{ matrix.label }}.zip"

      - name: Mac disk image (.dmg, drag to Applications)
        if: runner.os == 'macOS'
        run: |
          mkdir -p dmg_root
          cp -R dist/VerifyReportBuilder.app dmg_root/
          ln -s /Applications dmg_root/Applications
          hdiutil create -volname "Verify Report Builder" -srcfolder dmg_root -ov -format UDZO "VerifyReportBuilder-${{ matrix.label }}.dmg"

      - name: Attach the files to the Release (tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: false
          files: |
            VerifyReportBuilder-${{ matrix.label }}.zip
            VerifyReportBuilder-Setup-${{ matrix.label }}.exe
            VerifyReportBuilder-${{ matrix.label }}.dmg

      - uses: actions/upload-artifact@v4       # manual run only (a tag puts the files on the Release instead)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        with:
          name: VerifyReportBuilder-${{ matrix.label }}
          retention-days: 3
          path: |
            VerifyReportBuilder-${{ matrix.label }}.zip
            VerifyReportBuilder-Setup-${{ matrix.label }}.exe
            VerifyReportBuilder-${{ matrix.label }}.dmg
          if-no-files-found: error

  gui-smoke:                     # drives the real window against the mock server on each OS (does not block the build / release)
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements-dev.txt && (pip install "uharfbuzz>=0.37" || echo "uharfbuzz not available - Bangla in the PDF stays unshaped")
      - name: "GUI smoke (Linux, virtual display)"
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb python3-tk
          xvfb-run -a python tests/gui_smoke.py
      - name: GUI smoke
        if: runner.os != 'Linux'
        run: python tests/gui_smoke.py
